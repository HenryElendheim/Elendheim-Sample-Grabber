name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Create release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: >-
            Elendheim Sample Grabber is a one-button field recorder for
            Android. Tap the mic, it records a short grab, trims the silence
            off both ends, and saves it named by date to Music/Elendheim
            Samples. The settings choose the save format (WAV or MP3) and how
            long a grab runs (5 to 30 seconds).
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "Elendheim-Sample-Grabber-$TAG.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "Elendheim Sample Grabber $TAG" --notes "$NOTES"
            gh release upload "$TAG" "Elendheim-Sample-Grabber-$TAG.apk" --clobber
          else
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "Elendheim Sample Grabber $TAG" \
              --notes "$NOTES" \
              "Elendheim-Sample-Grabber-$TAG.apk"
          fi
