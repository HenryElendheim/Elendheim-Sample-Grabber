name: Build

on:
  push:
    branches: [testing, main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: elendheim-sample-grabber-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "Elendheim-Sample-Grabber-${{ github.event.release.tag_name }}.apk"
          gh release upload "${{ github.event.release.tag_name }}" "Elendheim-Sample-Grabber-${{ github.event.release.tag_name }}.apk" --clobber
